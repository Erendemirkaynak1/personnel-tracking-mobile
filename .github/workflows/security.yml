name: Security checks

on:
  push:
    branches: [main, "security/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Scan current tree and Git history for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Checkout full history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install pinned Gitleaks CLI
        run: |
          curl --fail --silent --show-error --location https://github.com/gitleaks/gitleaks/releases/download/v8.24.3/gitleaks_8.24.3_linux_x64.tar.gz | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan full Git history and working tree
        run: gitleaks detect --source . --config .gitleaks.toml --redact --exit-code 1 --verbose

  non-breaking-dependency-fix:
    name: Apply compatible dependency security updates
    if: github.event_name == 'push' && github.ref == 'refs/heads/security/hardening'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: "Personel takip projesi"
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@v4
        with:
          ref: security/hardening
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Personel takip projesi/package-lock.json"
      - name: Install locked dependencies
        run: npm ci
      - name: Apply non-breaking npm security fixes
        id: audit-fix
        run: npm audit fix
        continue-on-error: true
      - name: Commit updated lockfile
        if: always()
        working-directory: .
        run: |
          if git diff --quiet -- "Personel takip projesi/package-lock.json"; then
            echo "No compatible dependency updates were applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Personel takip projesi/package-lock.json"
          git commit -m "chore: apply compatible dependency security updates"
          git push origin HEAD:security/hardening

  app-and-database-security:
    name: App checks and Firebase rules tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Personel takip projesi"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: "Personel takip projesi/package-lock.json"
      - name: Install locked dependencies
        run: npm ci
      - name: Audit production and development dependencies
        run: npm audit --audit-level=high
      - name: TypeScript validation
        run: npx tsc --noEmit
      - name: Expo lint
        run: npx expo lint
      - name: Install isolated emulator test tools
        run: npm install --no-save --package-lock=false firebase-tools @firebase/rules-unit-testing
      - name: Test Realtime Database rules in emulator
        run: npx firebase-tools emulators:exec --only database --project demo-personnel-security "node security-tests/database.rules.test.cjs"
